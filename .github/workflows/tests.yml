name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # scikit-learn and qiskit-aer each bundle their own libgomp, and each needs a
      # slot in glibc's static TLS block; the default surplus (512 bytes) only fits
      # one, so whichever loads second fails with "cannot allocate memory in static
      # TLS block". Enlarge the surplus for every Python process in the job.
      GLIBC_TUNABLES: glibc.rtld.optional_static_tls=16384
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        qiskit-constraint: ["latest", "minimum"]
        exclude:
          # Para ahorrar minutos de CI, probamos el mínimo de Qiskit solo en una versión de Python
          - python-version: "3.11"
            qiskit-constraint: "minimum"
          - python-version: "3.12"
            qiskit-constraint: "minimum"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev and SDK extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Enforce minimum Qiskit version (boundary check)
        if: matrix.qiskit-constraint == 'minimum'
        run: |
          pip install "qiskit==1.0.0"

      - name: Display environment info
        run: |
          python -c "import qiskit; print('Qiskit version:', qiskit.__version__)"
          pip list | grep -E "qiskit|qang"

      - name: Run tests
        run: pytest -q --durations=10
