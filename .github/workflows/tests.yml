name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GLIBC_TUNABLES: glibc.rtld.optional_static_tls=16384
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev and SDK extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Display environment info
        run: |
          python -c "import qiskit; print('Qiskit version:', qiskit.__version__)"
          pip list | grep -E "qiskit|qang"

      - name: Run tests
        run: pytest -q --durations=10
