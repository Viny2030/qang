name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GLIBC_TUNABLES: glibc.rtld.optional_static_tls=16384
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev and SDK extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Display environment info
        run: |
          python -c "import qiskit; print('Qiskit version:', qiskit.__version__)"
          pip list | grep -E "qiskit|qang"

      - name: Run tests
        run: pytest -q --durations=10

  core:
    name: core + test deps (no SDKs)
    runs-on: ubuntu-24.04   # ubuntu-latest is 26.04, which has no Python 3.9 in setup-python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core + test dependencies (no quantum SDKs)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests (SDK tests skip via importorskip)
        run: pytest -q

  adapters:
    name: adapters (${{ matrix.extra }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        extra: [qiskit, pennylane, cirq, qutip]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[${{ matrix.extra }},dev]"
      - run: pytest -q tests/test_adapters.py

  invariance:
    name: backend invariance (qiskit + pennylane + cirq)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[qiskit,pennylane,cirq]"
      - run: python tools/verify_backend_invariance.py

  tensorcircuit:
    name: adapters (tensorcircuit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[tensorcircuit,dev]"
      - run: pytest -q tests/test_adapters.py
