project:
  type: book
  output-dir: _book

lang: es

book:
  title: "Computación, información y física cuántica en el espacio qang"
  subtitle: "Un tratado sobre la unidad qg, el filtro de simetría y sus aplicaciones"
  author: "Vicente Humberto Monteverde"
  date: "2026"
  repo-url: https://github.com/Viny2030/qang
  repo-subdir: book/es
  repo-actions: [issue]
  search: true
  downloads: [pdf, docx]
  output-file: qang-libro-es
  sidebar:
    tools:
      - text: "English edition"
        href: ../en/
  chapters:
    - index.qmd
    - part: "I. Fundamentos: la métrica angular-probabilística (la unidad qang)"
      chapters:
        - cap01.qmd
        - cap02.qmd
        - cap03.qmd
        - cap04.qmd
    - part: "II. Geometría local, óptica cuántica y fases geométricas"
      chapters:
        - cap05.qmd
        - cap06.qmd
        - cap07.qmd
        - cap08.qmd
    - part: "III. Física de neutrinos, oscilaciones y simulación cuántica (`qang.neutrino`)"
      chapters:
        - cap09.qmd
        - cap10.qmd
        - cap11.qmd
    - part: "IV. Teleportación cuántica en redes ópticas y distribución de entrelazamiento (`qang.qpon`)"
      chapters:
        - cap12.qmd
        - cap13.qmd
    - part: "V. Relatividad, bucles temporales y evaporación de agujeros negros (`qang.postselection`)"
      chapters:
        - cap14.qmd
        - cap15.qmd
    - part: "VI. Ciberseguridad cuántica, generación aleatoria y fronteras post-cuánticas"
      chapters:
        - cap16.qmd
        - cap17.qmd
        - cap18.qmd
        - cap19.qmd
    - part: "VII. Aprendizaje automático cuántico (QML) y el filtro de simetría"
      chapters:
        - cap20.qmd
        - cap21.qmd
        - cap22.qmd
        - cap23.qmd
    - part: "VIII. Dinámica de muchos cuerpos, canales abiertos, materia y química"
      chapters:
        - cap24.qmd
        - cap25.qmd
    - part: "IX. Corrección de errores, síndromes continuos y caracterización"
      chapters:
        - cap26.qmd
        - cap27.qmd
    - part: "X. Evidencia experimental, hardware real y auditoría de falsación"
      chapters:
        - cap28.qmd
        - cap29.qmd
        - cap30.qmd
        - cap31.qmd
        - cap32.qmd
    - part: "XI. Nanocuántica"
      chapters:
        - cap33.qmd
    - part: "XII. Aplicaciones transversales"
      chapters:
        - cap34.qmd
    - part: "XIII. Ecosistema: qang dentro de otras librerías"
      chapters:
        - cap35.qmd
    - bibliografia.qmd
  appendices:
    - apendice_a.qmd
    - apendice_b.qmd
    - apendice_c.qmd
    - apendice_d.qmd
    - apendice_e.qmd
    - apendice_f.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    html-math-method: mathjax
    code-copy: true
  pdf:
    documentclass: scrreprt
    pdf-engine: xelatex
    mainfont: DejaVu Serif
    sansfont: DejaVu Sans
    monofont: DejaVu Sans Mono
    number-sections: true
    toc: true
  docx:
    toc: true
    number-sections: true
