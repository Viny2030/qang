project:
  type: book
  output-dir: _book

lang: es

book:
  title: "Computación, información y física cuántica en el espacio qang"
  subtitle: "Un tratado sobre la unidad qg, el filtro de simetría y sus aplicaciones"
  author: "Vicente Humberto Monteverde"
  date: "2026"
  repo-url: https://github.com/Viny2030/qang
  repo-subdir: book/es
  repo-actions: [issue]
  search: true
  downloads: [pdf, docx]
  output-file: qang-libro-es
  sidebar:
    tools:
      - text: "English edition"
        href: ../en/
  chapters:
    - index.qmd
    - part: "I. Fundamentos: la métrica angular-probabilística (la unidad qang)"
      chapters:
        - cap01.qmd
        - cap02.qmd
        - cap03.qmd
        - cap04.qmd
    - part: "II. Geometría local y óptica cuántica"
      chapters:
        - cap05.qmd
        - cap06.qmd
    - part: "III. QAN, información y geometría de la información (`qang.qan`, `qang.qdist`, `qang.qfisher`)"
      chapters:
        - qjax07.qmd
        - qjax08.qmd
        - qjax09.qmd
    - part: "IV. Fases geométricas y metrología"
      chapters:
        - qjax10.qmd
        - qjax11.qmd
    - part: "V. Neutrinos: oscilación, materia y Majorana"
      chapters:
        - qjax12.qmd
        - qjax13.qmd
        - qjax14.qmd
    - part: "VI. Teleportación, bucles temporales y agujeros negros"
      chapters:
        - qjax15.qmd
        - qjax16.qmd
        - qjax17.qmd
        - qjax18.qmd
    - part: "VII. Criptografía y números aleatorios certificados"
      chapters:
        - qjax19.qmd
        - qjax20.qmd
        - qjax21.qmd
    - part: "VIII. Baterías, aprendizaje cuántico y filtro de simetría"
      chapters:
        - qjax22.qmd
        - qjax23.qmd
        - qjax24.qmd
        - qjax25.qmd
        - qjax26.qmd
    - part: "IX. Dinámica de muchos cuerpos, química y corrección de errores"
      chapters:
        - qjax27.qmd
        - qjax28.qmd
        - qjax29.qmd
    - part: "X. Caracterización, método y libro de cuentas"
      chapters:
        - qjax30.qmd
        - qjax31.qmd
        - qjax32.qmd
    - part: "XI. Alcance, límites, hardware real y arquitectura"
      chapters:
        - qjax33.qmd
        - qjax34.qmd
        - qjax35.qmd
        - qjax36.qmd
    - part: "XII. Nanocuántica, aplicaciones transversales e integraciones"
      chapters:
        - qjax37.qmd
        - qjax38.qmd
        - qjax39.qmd
    - part: "XIII. Física extendida: materia y antimateria, viajes en el tiempo y cuerdas"
      chapters:
        - qjax40.qmd
        - qjax41.qmd
        - qjax42.qmd
    - part: "XIV. Sistemas autónomos: robótica e IA agéntica cuánticas"
      chapters:
        - qjax43.qmd
        - qjax44.qmd
    - bibliografia.qmd
  appendices:
    - apendice_a.qmd
    - apendice_b.qmd
    - apendice_c.qmd
    - apendice_d.qmd
    - apendice_e.qmd
    - apendice_f.qmd
    - apendice_g.qmd
    - apendice_h.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    html-math-method: mathjax
    code-copy: true
  pdf:
    documentclass: scrreprt
    pdf-engine: xelatex
    mainfont: DejaVu Serif
    sansfont: DejaVu Sans
    monofont: DejaVu Sans Mono
    number-sections: true
    toc: true
  docx:
    toc: true
    number-sections: true
