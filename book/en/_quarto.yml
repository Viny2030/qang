project:
  type: book
  output-dir: _book

lang: en

book:
  title: "Quantum Computing, Information and Physics in qang Space"
  subtitle: "A treatise on the qg unit, the symmetry filter and their applications"
  author: "Vicente Humberto Monteverde"
  date: "2026"
  repo-url: https://github.com/Viny2030/qang
  repo-subdir: book/en
  repo-actions: [issue]
  search: true
  downloads: [pdf, docx]
  output-file: qang-book-en
  sidebar:
    tools:
      - text: "Edición en español"
        href: ../es/
  chapters:
    - index.qmd
    - part: "I. Foundations: the angular–probabilistic metric (the qang unit)"
      chapters:
        - cap01.qmd
        - cap02.qmd
        - cap03.qmd
        - cap04.qmd
    - part: "II. Local geometry, quantum optics and geometric phases"
      chapters:
        - cap05.qmd
        - cap06.qmd
        - cap07.qmd
        - cap08.qmd
    - part: "III. Neutrino physics, oscillations and quantum simulation (`qang.neutrino`)"
      chapters:
        - cap09.qmd
        - cap10.qmd
        - cap11.qmd
    - part: "IV. Quantum teleportation in optical networks and entanglement distribution (`qang.qpon`)"
      chapters:
        - cap12.qmd
        - cap13.qmd
    - part: "V. Relativity, time loops and black-hole evaporation (`qang.postselection`)"
      chapters:
        - cap14.qmd
        - cap15.qmd
    - part: "VI. Quantum cybersecurity, random-number generation and post-quantum frontiers"
      chapters:
        - cap16.qmd
        - cap17.qmd
        - cap18.qmd
        - cap19.qmd
    - part: "VII. Quantum machine learning (QML) and the symmetry filter"
      chapters:
        - cap20.qmd
        - cap21.qmd
        - cap22.qmd
        - cap23.qmd
    - part: "VIII. Many-body dynamics, open channels, matter and chemistry"
      chapters:
        - cap24.qmd
        - cap25.qmd
    - part: "IX. Error correction, continuous syndromes and characterization"
      chapters:
        - cap26.qmd
        - cap27.qmd
    - part: "X. Experimental evidence, real hardware and the falsification audit"
      chapters:
        - cap28.qmd
        - cap29.qmd
        - cap30.qmd
        - cap31.qmd
        - cap32.qmd
    - part: "XI. Nanoquantum"
      chapters:
        - cap33.qmd
    - part: "XII. Cross-domain applications"
      chapters:
        - cap34.qmd
    - part: "XIII. Ecosystem: qang inside other libraries"
      chapters:
        - cap35.qmd
    - references.qmd
  appendices:
    - appendix_a.qmd
    - appendix_b.qmd
    - appendix_c.qmd
    - appendix_d.qmd
    - appendix_e.qmd
    - appendix_f.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    html-math-method: mathjax
    code-copy: true
  pdf:
    documentclass: scrreprt
    pdf-engine: xelatex
    mainfont: DejaVu Serif
    sansfont: DejaVu Sans
    monofont: DejaVu Sans Mono
    number-sections: true
    toc: true
  docx:
    toc: true
    number-sections: true
