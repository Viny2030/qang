project:
  type: book
  output-dir: _book

lang: en

book:
  title: "Quantum Computing, Information and Physics in qang Space"
  subtitle: "A treatise on the qg unit, the symmetry filter and their applications"
  author: "Vicente Humberto Monteverde"
  date: "2026"
  repo-url: https://github.com/Viny2030/qang
  repo-subdir: book/en
  repo-actions: [issue]
  search: true
  downloads: [pdf, docx]
  output-file: qang-book-en
  sidebar:
    tools:
      - text: "Edición en español"
        href: ../es/
  chapters:
    - index.qmd
    - part: "I. Foundations: the angular–probabilistic metric (the qang unit)"
      chapters:
        - cap01.qmd
        - cap02.qmd
        - cap03.qmd
        - cap04.qmd
    - part: "II. Local geometry and quantum optics"
      chapters:
        - cap05.qmd
        - cap06.qmd
    - part: "III. QAN, information and information geometry (`qang.qan`, `qang.qdist`, `qang.qfisher`)"
      chapters:
        - qjax07.qmd
        - qjax08.qmd
        - qjax09.qmd
    - part: "IV. Geometric phases and metrology"
      chapters:
        - qjax10.qmd
        - qjax11.qmd
    - part: "V. Neutrinos: oscillation, matter and Majorana"
      chapters:
        - qjax12.qmd
        - qjax13.qmd
        - qjax14.qmd
    - part: "VI. Teleportation, time loops and black holes"
      chapters:
        - qjax15.qmd
        - qjax16.qmd
        - qjax17.qmd
        - qjax18.qmd
    - part: "VII. Cryptography and certified random numbers"
      chapters:
        - qjax19.qmd
        - qjax20.qmd
        - qjax21.qmd
    - part: "VIII. Batteries, quantum learning and the symmetry filter"
      chapters:
        - qjax22.qmd
        - qjax23.qmd
        - qjax24.qmd
        - qjax25.qmd
        - qjax26.qmd
    - part: "IX. Many-body dynamics, chemistry and error correction"
      chapters:
        - qjax27.qmd
        - qjax28.qmd
        - qjax29.qmd
    - part: "X. Characterization, method and ledger"
      chapters:
        - qjax30.qmd
        - qjax31.qmd
        - qjax32.qmd
    - part: "XI. Scope, limits, real hardware and architecture"
      chapters:
        - qjax33.qmd
        - qjax34.qmd
        - qjax35.qmd
        - qjax36.qmd
    - part: "XII. Nanoquantum, cross-cutting applications and integrations"
      chapters:
        - qjax37.qmd
        - qjax38.qmd
        - qjax39.qmd
    - part: "XIII. Extended physics: matter and antimatter, time travel and strings"
      chapters:
        - qjax40.qmd
        - qjax41.qmd
        - qjax42.qmd
    - part: "XIV. Autonomous systems: quantum robotics and agentic AI"
      chapters:
        - qjax43.qmd
        - qjax44.qmd
        - qjax45.qmd
        - qjax46.qmd
    - references.qmd
  appendices:
    - appendix_a.qmd
    - appendix_b.qmd
    - appendix_c.qmd
    - appendix_d.qmd
    - appendix_e.qmd
    - appendix_f.qmd
    - appendix_g.qmd
    - appendix_h.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    html-math-method: mathjax
    code-copy: true
  pdf:
    documentclass: scrreprt
    pdf-engine: xelatex
    header-includes:
      - \providecommand{\tfrac}[2]{\frac{#1}{#2}}
    mainfont: DejaVu Serif
    sansfont: DejaVu Sans
    monofont: DejaVu Sans Mono
    number-sections: true
    toc: true
  docx:
    toc: true
    number-sections: true
