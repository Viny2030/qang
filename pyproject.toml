[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qang"
version = "0.2.2"
description = "The Qang (qg): a unified angular-probability unit and metric for parametric quantum circuit design."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT" 
authors = [
    { name = "Vicente Humberto Monteverde", email = "viny01958@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0", "qiskit-aer"]
cirq = ["cirq>=1.0"]
dev = ["pytest>=7.0", "matplotlib>=3.7"]
all = ["qiskit>=1.0", "qiskit-aer", "cirq>=1.0", "pytest>=7.0", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/Viny2030/qang"
Repository = "https://github.com/Viny2030/qang.git"
"Bug Tracker" = "https://github.com/Viny2030/qang/issues"
Paper = "https://doi.org/10.5281/zenodo.22832150"

[tool.setuptools.packages.find]
include = ["qang*"]
