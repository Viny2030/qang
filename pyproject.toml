[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qang"
version = "0.6.0"
description = "The Qang (qg): a unified angular-probability unit and metric for parametric quantum circuit design."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT" 
authors = [
    { name = "Vicente Humberto Monteverde", email = "viny01958@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0", "qiskit-aer"]
cirq = ["cirq>=1.0"]
pennylane = ['pennylane>=0.42; python_version >= "3.10"']
hardware = ["qiskit>=1.0", "qiskit-aer", "qiskit-ibm-runtime>=0.40"]
knitting = ["qiskit>=1.0", "qiskit-aer", "qiskit-addon-cutting>=0.9"]
ionq = ["qiskit>=1.0", "qiskit-aer", 'qiskit-ionq>=1.0; python_version >= "3.10"', "requests"]
qec = ["pymatching>=2.0"]
chemistry = ['pyscf>=2.3; sys_platform != "win32"', "openfermion>=1.6", 'openfermionpyscf>=0.5; sys_platform != "win32"']
examples = ["scipy>=1.10", "matplotlib>=3.7", "scikit-learn>=1.2"]
dev = ["pytest>=7.0", "matplotlib>=3.7", "scipy>=1.10"]
all = ["qiskit>=1.0", "qiskit-aer", "qiskit-ibm-runtime>=0.40", "qiskit-addon-cutting>=0.9", 'qiskit-ionq>=1.0; python_version >= "3.10"', "requests", "pymatching>=2.0", "cirq>=1.0", 'pennylane>=0.42; python_version >= "3.10"', "scipy>=1.10", "pytest>=7.0", "matplotlib>=3.7", "scikit-learn>=1.2"]

[project.urls]
Homepage = "https://github.com/Viny2030/qang"
Repository = "https://github.com/Viny2030/qang.git"
"Bug Tracker" = "https://github.com/Viny2030/qang/issues"
Paper = "https://doi.org/10.5281/zenodo.22832150"

[tool.setuptools.packages.find]
include = ["qang*"]
