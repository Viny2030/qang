[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qang"
version = "0.13.0"
description = "The Qang (qg): a unified angular-probability unit and metric for parametric quantum circuit design."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Vicente Humberto Monteverde", email = "viny01958@gmail.com" }
]
keywords = [
    "quantum computing", "qiskit", "cirq", "pennylane", "quantum machine learning", "mitiq", "qutip", "stim",
    "cuda-q", "scikit-learn", "jax",
    "error mitigation", "post-selection", "bloch sphere", "variational circuits", "arcsine transformation",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Development Status :: 4 - Beta",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0,<3", "qiskit-aer"]
cirq = ["cirq>=1.0"]
pennylane = ['pennylane>=0.42; python_version >= "3.10"']
hardware = ["qiskit>=1.0,<3", "qiskit-aer", "qiskit-ibm-runtime>=0.40"]
knitting = ["qiskit>=1.0,<3", "qiskit-aer", "qiskit-addon-cutting>=0.9"]
ionq = ["qiskit>=1.0,<3", "qiskit-aer", 'qiskit-ionq>=1.0; python_version >= "3.10"', "requests"]
qec = ["pymatching>=2.0"]
ml = ["qiskit>=1.0,<3", "qiskit-aer", "qiskit-machine-learning>=0.8"]
chemistry = ['pyscf>=2.3; sys_platform != "win32"', "openfermion>=1.6", 'openfermionpyscf>=0.5; sys_platform != "win32"']
examples = ["scipy>=1.10", "matplotlib>=3.7", "scikit-learn>=1.2"]
dev = ["pytest>=7.0", "matplotlib>=3.7", "scipy>=1.10"]
# qang.integrations (book, chapter 35): one extra per library
mitiq = ["mitiq>=1.0"]
experiments = ["qiskit>=1.0,<3", "qiskit-aer", "qiskit-experiments>=0.6"]
dynamics = ["qiskit-dynamics>=0.5"]                     # pulls qiskit<=1.3: install it in its own environment
qutip = ["qutip>=5.0"]
stim = ["stim>=1.12", "pymatching>=2.0"]
sklearn = ["scikit-learn>=1.2"]
jax = ['jax[cpu]>=0.4.30,<0.9; python_version >= "3.10"', 'pennylane>=0.42; python_version >= "3.10"']
torch = ['torch>=2.0', 'pennylane>=0.42; python_version >= "3.10"']
qibo = ["qibo>=0.2"]
pytket = ["pytket>=1.30"]
braket = ["amazon-braket-sdk>=1.80"]
cudaq = ['cudaq>=0.9; sys_platform != "win32"']
integrations = [
    "mitiq>=1.0",
    "qiskit>=1.0,<3",
    "qiskit-aer",
    "qiskit-experiments>=0.6",
    "qutip>=5.0",
    "stim>=1.12",
    "pymatching>=2.0",
    "scikit-learn>=1.2",
    'jax[cpu]>=0.4.30,<0.9; python_version >= "3.10"',
    'pennylane>=0.42; python_version >= "3.10"',
    "torch>=2.0",
    "qibo>=0.2",
    "pytket>=1.30",
    "amazon-braket-sdk>=1.80",
]
all = [
    "qiskit>=1.0,<3",
    "qiskit-aer",
    "qiskit-ibm-runtime>=0.40",
    "qiskit-addon-cutting>=0.9",
    'qiskit-ionq>=1.0; python_version >= "3.10"',
    "requests",
    "pymatching>=2.0",
    "cirq>=1.0",
    'pennylane>=0.42; python_version >= "3.10"',
    "scipy>=1.10",
    "pytest>=7.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.2"
]

[project.urls]
Homepage = "https://github.com/Viny2030/qang"
Repository = "https://github.com/Viny2030/qang.git"
Changelog = "https://github.com/Viny2030/qang/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/Viny2030/qang/issues"
Paper = "https://doi.org/10.5281/zenodo.22832150"

[tool.setuptools.packages.find]
include = ["qang*"]
